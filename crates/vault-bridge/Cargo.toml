[package]
name = "vault-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
vault-core = { path = "../vault-core" }
tiny_http = "0.12"
base64 = "0.22"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"
full_moon = { version = "3", features = ["luau"] }
